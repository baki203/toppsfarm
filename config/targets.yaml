# Harte Ziele. Ohne Eintrag laeuft Watch auf alles.
# Spalten je Set:
#   name/match: Anzeige / Handle-Substring, set: Setname (fuer Aufloesung),
#   handle: festes Produkt-Handle, variant_id: feste Variante (Schnellweg),
#   priority: Reihenfolge (niedriger zuerst), min_price/max_price: Preisband,
#   qty: Menge, hosts: erlaubte Shops, mode: cart/browser, tasks.
# Nutzerlisten je Set (additiv zu den Code-Defaults, leer = Defaults aktiv):
#   negativ: nie kaufen, positiv: Zusatzsignale, allow: Ausnahmen (blockt nie).
# min_price-Vorschlag (Median der letzten 5 Hobby-Box-Preise minus 30 %) wird
# als Kommentar beim Auto-Write-Back eingetragen.

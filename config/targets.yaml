  set: "Chrome UEFA"
  hosts: [de.topps.com, es.topps.com, fr.topps.com, it.topps.com]
  qty: 1
  mode: cart
  tasks: 10
  min_price: 0
  max_price: 0
  priority: 1
  negativ: []
  positiv: []
  allow: []

